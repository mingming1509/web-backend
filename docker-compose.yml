services:
  postgres:
    image: postgres:16-alpine
    container_name: web-backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-web_backend}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-web_backend}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: web-backend-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      # Reach Postgres over the compose network, not localhost.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-web_backend}
      DB_SYNCHRONIZE: 'false'
      DB_LOGGING: ${DB_LOGGING:-false}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-min-16-chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
    ports:
      - '${PORT:-3000}:3000'
    # Apply pending migrations, then start the compiled server.
    command: >
      sh -c "node node_modules/typeorm/cli.js migration:run -d dist/database/data-source.js
      && node dist/main"

volumes:
  postgres_data:
